name: Deploy Vorschau (GitHub Pages)

# Baut die Vite-App und veröffentlicht sie auf GitHub Pages, sobald der
# Arbeits-Branch aktualisiert wird — damit der Betreiber jederzeit eine
# echte, aktuelle Vorschau unter einer festen URL öffnen kann.
on:
  push:
    branches: [claude/gracious-gates-n4j6z2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
