# Baut die Seite täglich neu, damit die Gebetszeiten aktuell bleiben (scripts/mawaqit.mjs holt sie beim Build).
# Dieser Workflow liegt im Unterordner masjid-sunnah/ und läuft erst, wenn der Ordner das Repo-Wurzelverzeichnis ist.
name: Täglicher Build
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build # prebuild lädt MAWAQIT; bei Fehler Warnung + Fallback-Datei, Build bricht nicht ab
      - uses: actions/upload-artifact@v4
        with: { name: site, path: out }
      # TODO: Deployment hängt vom Hosting ab (SFTP/FTP, Vercel, Netlify …). Hier den passenden Schritt ergänzen.
