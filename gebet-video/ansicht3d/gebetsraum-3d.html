<title>Gebetsraum 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Vollbild-3D, oben eine schmale Leiste mit Ansichten; einheitlich dunkles Navy (bewusst ein Look) */
:root {
  --navy: #212242;
  --navy-2: #2c2e55;
  --gold: #ca9e4e;
  --weiss: #f6f3ec;
  --grau: #b9bad0;
  --font: "Outfit", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--navy); color: var(--weiss); font-family: var(--font); overflow: hidden; }
#bühne { position: fixed; inset: 0; touch-action: none; }
#bühne canvas { display: block; width: 100%; height: 100%; }
.leiste {
  position: fixed; left: 0; right: 0; top: 0; z-index: 2;
  padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--navy) 55%, transparent);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
}
.name { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.name b { font-size: 18px; font-weight: 600; letter-spacing: .01em; }
.name span { font-size: 12px; color: var(--gold); letter-spacing: .08em; text-transform: uppercase; }
.knöpfe { display: flex; flex-wrap: wrap; gap: 8px; }
button {
  font: 500 14px var(--font); color: var(--weiss); background: var(--navy-2);
  border: 1px solid rgba(202,158,78,.35); border-radius: 999px; padding: 9px 15px; cursor: pointer;
}
button[aria-pressed="true"] { background: var(--gold); color: var(--navy); border-color: var(--gold); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.hinweis {
  position: fixed; z-index: 2; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center; font-size: 13px; color: var(--grau); pointer-events: none;
}
.hinweis span { background: rgba(33,34,66,.78); padding: 7px 12px; border-radius: 8px; }
#laden { position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; background: var(--navy); font-size: 15px; color: var(--grau); }
#laden b { display: block; color: var(--gold); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; text-align: center; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">

<div id="bühne"></div>
<header class="leiste">
  <div class="name"><span>Masjid As-Sunnah Ratingen</span><b>Gebetsraum in 3D</b></div>
  <nav class="knöpfe" aria-label="Ansichten">
    <button id="v-eingang" aria-pressed="true">Vom Eingang</button>
    <button id="v-mihrab" aria-pressed="false">Zum Mihrab</button>
    <button id="v-seite" aria-pressed="false">Von der Seite</button>
    <button id="v-oben" aria-pressed="false">Von oben</button>
  </nav>
</header>
<p class="hinweis"><span>Ein Finger: drehen · Zwei Finger: zoomen und schieben</span></p>
<div id="laden"><div><b>Blender-Modell</b><span id="laden-text">Gebetsraum wird geladen …</span></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(function () {
  const bühne = document.getElementById('bühne');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.physicallyCorrectLights = true;
  bühne.appendChild(renderer.domElement);

  const szene = new THREE.Scene();
  szene.background = new THREE.Color(0x212242);
  const pmrem = new THREE.PMREMGenerator(renderer);
  szene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
  szene.add(new THREE.HemisphereLight(0xfff4e2, 0x3a8f86, 1.1));
  const sonne = new THREE.DirectionalLight(0xfff0dc, 1.6);
  sonne.position.set(-4, 6, 3); szene.add(sonne);

  const kamera = new THREE.PerspectiveCamera(60, 1, 0.05, 100);
  const steuer = new THREE.OrbitControls(kamera, renderer.domElement);
  steuer.enableDamping = true; steuer.dampingFactor = 0.08;
  steuer.minDistance = 0.4; steuer.maxDistance = 18;

  // Blender (x, y, z) → hier (x, z, −y). In Blender zeigt +y zur Qibla.
  const B = (x, y, z) => new THREE.Vector3(x, z, -y);
  const ANSICHTEN = {
    'v-eingang': { pos: B(0, -5.6, 1.7), ziel: B(0, 3.5, 1.1), decke: true },
    'v-mihrab':  { pos: B(0.4, 1.2, 1.5), ziel: B(0, 6.2, 1.4), decke: true },
    'v-seite':   { pos: B(4.6, -3.2, 2.3), ziel: B(-1, 2, 0.8), decke: true },
    'v-oben':    { pos: B(0, -3.2, 11), ziel: B(0, 0.6, 0), decke: false },
  };
  let decke = [];
  let flug = null;

  function zeige(id, sofort) {
    const a = ANSICHTEN[id];
    document.querySelectorAll('.knöpfe button').forEach(b => b.setAttribute('aria-pressed', String(b.id === id)));
    decke.forEach(o => { o.visible = a.decke; });
    if (sofort || matchMedia('(prefers-reduced-motion: reduce)').matches) {
      kamera.position.copy(a.pos); steuer.target.copy(a.ziel); steuer.update(); flug = null; return;
    }
    flug = { p0: kamera.position.clone(), z0: steuer.target.clone(), p1: a.pos, z1: a.ziel, t: 0 };
  }
  Object.keys(ANSICHTEN).forEach(id => document.getElementById(id).addEventListener('click', () => zeige(id)));

  function größe() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false); kamera.aspect = w / h;
    kamera.fov = w < h ? 72 : 58; kamera.updateProjectionMatrix();
  }
  window.addEventListener('resize', größe); größe();

  const text = document.getElementById('laden-text');
  const fehler = () => { text.textContent = 'Das Modell konnte nicht geladen werden. Bitte Seite neu laden.'; };
  const skript = document.createElement('script');
  skript.src = 'gebetsraum-modell.js';
  skript.onerror = fehler;
  skript.onload = () => {
    try {
      const roh = atob(window.GEBETSRAUM_GLB);
      const daten = new Uint8Array(roh.length);
      for (let i = 0; i < roh.length; i++) daten[i] = roh.charCodeAt(i);
      new THREE.GLTFLoader().parse(daten.buffer, '', gltf => {
        gltf.scene.traverse(o => {
          if (/^Decke|Deckenleuchte|LED_/i.test(o.name)) decke.push(o);
        });
        szene.add(gltf.scene);
        document.getElementById('laden').hidden = true;
        zeige('v-eingang', true);
      }, fehler);
    } catch (e) { fehler(); }
  };
  document.head.appendChild(skript);

  const glatt = x => x * x * (3 - 2 * x);
  let zuletzt = performance.now();
  renderer.setAnimationLoop(jetzt => {
    const dt = Math.min(0.05, (jetzt - zuletzt) / 1000); zuletzt = jetzt;
    if (flug) {
      flug.t = Math.min(1, flug.t + dt / 1.1);
      const k = glatt(flug.t);
      kamera.position.lerpVectors(flug.p0, flug.p1, k);
      steuer.target.lerpVectors(flug.z0, flug.z1, k);
      if (flug.t >= 1) flug = null;
    }
    steuer.update();
    renderer.render(szene, kamera);
  });
  renderer.domElement.addEventListener('pointerdown', () => { flug = null; });
})();
</script>
